<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 40" width="900" height="40" role="img" aria-label="ink brush divider">
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#e3b873" stop-opacity="0"/>
    <stop offset="18%"  stop-color="#e3b873" stop-opacity=".85"/>
    <stop offset="50%"  stop-color="#f6e3b4" stop-opacity="1"/>
    <stop offset="82%"  stop-color="#e3b873" stop-opacity=".85"/>
    <stop offset="100%" stop-color="#e3b873" stop-opacity="0"/>
  </linearGradient>
</defs>
<style><![CDATA[
  @keyframes brush { to { stroke-dashoffset: 0; } }
  @keyframes glide { 0% { transform: translateX(-40px); opacity:0; }
                     10%,90% { opacity:.9; }
                     100% { transform: translateX(880px); opacity:0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stroke { stroke-dasharray: 900; stroke-dashoffset: 900; animation: brush 2.6s ease-out forwards; }
  .spark  { animation: glide 6s ease-in-out infinite; }
  .mini   { animation: spin 9s linear infinite; transform-origin: 450px 20px; }
  @media (prefers-reduced-motion: reduce) { .stroke { stroke-dashoffset: 0; } .spark,.mini { animation: none; } }
]]></style>
<path class="stroke" d="M20 22 C 160 12, 300 28, 430 20" fill="none" stroke="url(#ink)" stroke-width="2.4" stroke-linecap="round"/>
<path class="stroke" d="M470 20 C 600 12, 740 28, 880 18" fill="none" stroke="url(#ink)" stroke-width="2.4" stroke-linecap="round"/>
<g class="mini">
  <g transform="translate(450,20) scale(0.14)">
    <circle r="100" fill="#f4efe4"/>
    <path d="M 0,-100 A 100,100 0 0,1 0,100 A 50,50 0 0,1 0,0 A 50,50 0 0,0 0,-100 Z" fill="#10151c"/>
    <circle cx="0" cy="-50" r="16" fill="#10151c"/>
    <circle cx="0" cy="50"  r="16" fill="#f4efe4"/>
    <circle r="100" fill="none" stroke="#e3b873" stroke-width="8"/>
  </g>
</g>
<circle class="spark" cx="20" cy="20" r="2.2" fill="#63d2a5" opacity="0"/>
</svg>
