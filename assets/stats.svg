               fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </circle>
    <circle cx="700" cy="214" r="92" fill="none" stroke="#9ec7b6" stroke-width="17"
            stroke-dasharray="62.40 515.65" stroke-dashoffset="-428.36"
            stroke-linecap="butt" opacity=".92" transform="rotate(-90 700 214)">
      <animate attributeName="stroke-dasharray" from="0 578.05"
               to="62.40 515.65" dur="1.1s" begin="0.78s"
               fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </circle>
    <circle cx="700" cy="214" r="92" fill="none" stroke="#a8271c" stroke-width="17"
            stroke-dasharray="42.16 535.89" stroke-dashoffset="-490.76"
            stroke-linecap="butt" opacity=".92" transform="rotate(-90 700 214)">
      <animate attributeName="stroke-dasharray" from="0 578.05"
               to="42.16 535.89" dur="1.1s" begin="0.94s"
               fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </circle>
    <circle cx="700" cy="214" r="92" fill="none" stroke="#4d6a80" stroke-width="17"
            stroke-dasharray="45.13 532.92" stroke-dashoffset="-532.92"
            stroke-linecap="butt" opacity=".92" transform="rotate(-90 700 214)">
      <animate attributeName="stroke-dasharray" from="0 578.05"
               to="45.13 532.92" dur="1.1s" begin="1.10s"
               fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </circle></g>
<g class="yy">
  <g transform="translate(700,214) scale(0.33)">
    <circle r="100" fill="#eae3d4"/>
    <path d="M 0,-100 A 100,100 0 0,1 0,100 A 50,50 0 0,1 0,0 A 50,50 0 0,0 0,-100 Z" fill="#10151c"/>
