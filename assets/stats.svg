<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-label="GitHub statistics for SHIVSSV1269">
<defs>
  <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0c1117"/><stop offset="100%" stop-color="#10161e"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#e3b873"/><stop offset="100%" stop-color="#f6e3b4"/>
  </linearGradient>
  <filter id="sglow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style><![CDATA[
  .m  { font-family:"Georgia","Iowan Old Style","Times New Roman",serif; }
  .mo { font-family:"JetBrains Mono","SF Mono","Consolas",monospace; }
  .num { font-family:"Georgia",serif; font-size:30px; fill:url(#gold); }
  .lbl { font-family:"Georgia",serif; font-size:12px; fill:#6f8697; letter-spacing:1.4px; }
  .leg { font-family:"Georgia",serif; font-size:13px; fill:#eae3d4; }
  .legpct { font-family:"JetBrains Mono","Consolas",monospace; font-size:12px; fill:#6f8697; text-anchor:end; }
  @keyframes slide { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: none; } }
  @keyframes spin  { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity:.30; } 50% { opacity:.75; } }
  .tile { opacity:0; animation: slide .7s ease-out forwards; }
  .yy   { animation: spin 24s linear infinite; transform-origin: 700px 214px; }
  .halo { animation: pulse 5s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .tile { opacity:1; animation:none; } .yy,.halo { animation:none; }
  }
]]></style>

<rect width="860" height="430" rx="14" fill="url(#sbg)" stroke="#e3b873" stroke-opacity=".22"/>

<text class="m" x="36" y="50" font-size="22" fill="#e3b873" letter-spacing="5">THE RECORD</text>
<text class="mo" x="824" y="49" font-size="11" fill="#4f6376" text-anchor="end">SELF-HOSTED &#183; 10 AUG 2026</text>
<path d="M36 64 H824" stroke="#e3b873" stroke-opacity=".18"/>

  <g class="tile" style="animation-delay:0.25s">
    <text class="num" x="44" y="116">34</text>
    <text class="lbl" x="44" y="136">commits this year</text>
    <path d="M44 146 H194" stroke="#e3b873" stroke-opacity=".14"/>
  </g>
  <g class="tile" style="animation-delay:0.36s">
    <text class="num" x="254" y="116">47</text>
    <text class="lbl" x="254" y="136">total contributions</text>
    <path d="M254 146 H404" stroke="#e3b873" stroke-opacity=".14"/>
  </g>
  <g class="tile" style="animation-delay:0.47s">
    <text class="num" x="44" y="192">22</text>
    <text class="lbl" x="44" y="212">stars earned</text>
    <path d="M44 222 H194" stroke="#e3b873" stroke-opacity=".14"/>
  </g>
  <g class="tile" style="animation-delay:0.58s">
    <text class="num" x="254" y="192">13</text>
    <text class="lbl" x="254" y="212">public repositories</text>
    <path d="M254 222 H404" stroke="#e3b873" stroke-opacity=".14"/>
  </g>
  <g class="tile" style="animation-delay:0.69s">
    <text class="num" x="44" y="268">0</text>
    <text class="lbl" x="44" y="288">pull requests opened</text>
    <path d="M44 298 H194" stroke="#e3b873" stroke-opacity=".14"/>
  </g>
  <g class="tile" style="animation-delay:0.80s">
    <text class="num" x="254" y="268">6</text>
    <text class="lbl" x="254" y="288">followers</text>
    <path d="M254 298 H404" stroke="#e3b873" stroke-opacity=".14"/>
  </g>

<!-- language ring -->
<circle class="halo" cx="700" cy="214" r="114" fill="none" stroke="#e3b873" stroke-width=".7" opacity=".3"/>
<circle cx="700" cy="214" r="92" fill="none" stroke="#1b2530" stroke-width="17"/>
<g filter="url(#sglow)">
    <circle cx="700" cy="214" r="92" fill="none" stroke="#e3b873" stroke-width="17"
            stroke-dasharray="249.36 328.69" stroke-dashoffset="-0.00"
