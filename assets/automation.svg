<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="The automation array - an n8n workflow">
<defs>
  <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0b1016"/><stop offset="100%" stop-color="#10161e"/>
  </linearGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#e3b873" fill-opacity=".07"/>
  </pattern>
  <filter id="pglow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style><![CDATA[
  .m  { font-family:"Georgia","Iowan Old Style","Times New Roman",serif; }
  .mo { font-family:"JetBrains Mono","SF Mono","Consolas",monospace; }
  .cap  { font-size:12.5px; fill:#eae3d4; text-anchor:middle; }
  .kind { font-size:9px; fill:#6f8697; text-anchor:middle; letter-spacing:2px; }
  @keyframes fire  { 0%,72%,100% { stroke-opacity:.35; } 78% { stroke-opacity:1; } 88% { stroke-opacity:.55; } }
  @keyframes spin  { to { transform: rotate(360deg); } }
  @keyframes blink { 0%,100% { opacity:.25; } 50% { opacity:1; } }
  @keyframes dash  { to { stroke-dashoffset: -28; } }
  .node  { animation: fire 4.4s ease-in-out infinite; }
  .n2 { animation-delay:.55s; } .n3 { animation-delay:1.1s; } .n4 { animation-delay:1.65s; }
  .wire  { stroke-dasharray: 4 5; animation: dash 1.6s linear infinite; }
  .yy    { animation: spin 18s linear infinite; transform-origin: 828px 176px; }
  .live  { animation: blink 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .node,.wire,.yy,.live { animation: none; } }
]]></style>

<rect width="900" height="300" rx="14" fill="url(#abg)" stroke="#e3b873" stroke-opacity=".2"/>
<rect width="900" height="300" rx="14" fill="url(#grid)"/>

<text class="m" x="36" y="46" font-size="18" fill="#e3b873" letter-spacing="5">THE AUTOMATION ARRAY</text>
<text class="mo" x="864" y="45" font-size="11" fill="#4f6376" text-anchor="end">
  <tspan class="live" fill="#63d2a5">&#9679;</tspan> n8n &#183; always running
</text>
<path d="M36 60 H864" stroke="#e3b873" stroke-opacity=".18"/>

<!-- wires (drawn under the nodes) -->
<g fill="none" stroke="#63d2a5" stroke-opacity=".45" stroke-width="1.6">
  <path id="w1" class="wire" d="M158 176 H236"/>
  <path id="w2" class="wire" d="M356 176 C 396 176, 396 118, 436 118"/>
  <path id="w3" class="wire" d="M356 176 C 396 176, 396 234, 436 234"/>
  <path id="w4" class="wire" d="M556 118 C 596 118, 596 176, 636 176"/>
  <path id="w5" class="wire" d="M556 234 C 596 234, 596 176, 636 176"/>
  <path id="w6" class="wire" d="M756 176 H794"/>
</g>

<!-- packets travelling the wires -->
<g fill="#f6e3b4" filter="url(#pglow)">
  <circle r="3.2"><animateMotion dur="4.4s" repeatCount="indefinite"><mpath href="#w1" xlink:href="#w1"/></animateMotion></circle>
  <circle r="3.2"><animateMotion dur="4.4s" begin="0.55s" repeatCount="indefinite"><mpath href="#w2" xlink:href="#w2"/></animateMotion></circle>
  <circle r="2.6" fill="#63d2a5"><animateMotion dur="4.4s" begin="0.7s" repeatCount="indefinite"><mpath href="#w3" xlink:href="#w3"/></animateMotion></circle>
  <circle r="3.2"><animateMotion dur="4.4s" begin="1.25s" repeatCount="indefinite"><mpath href="#w4" xlink:href="#w4"/></animateMotion></circle>
  <circle r="2.6" fill="#63d2a5"><animateMotion dur="4.4s" begin="1.4s" repeatCount="indefinite"><mpath href="#w5" xlink:href="#w5"/></animateMotion></circle>
  <circle r="3.2"><animateMotion dur="4.4s" begin="1.95s" repeatCount="indefinite"><mpath href="#w6" xlink:href="#w6"/></animateMotion></circle>
</g>

<!-- node 1 : trigger -->
<g>
  <rect class="node" x="40" y="150" width="118" height="52" rx="9" fill="#101820" stroke="#e2513f"/>
  <rect x="40" y="150" width="4" height="52" rx="2" fill="#e2513f"/>
  <circle class="live" cx="56" cy="176" r="3.4" fill="#e2513f"/>
  <text class="m kind" x="103" y="170">TRIGGER</text>
  <text class="m cap"  x="103" y="188">Webhook</text>
</g>

<!-- node 2 : transform -->
<g>
  <rect class="node n2" x="236" y="150" width="120" height="52" rx="9" fill="#101820" stroke="#e3b873"/>
  <rect x="236" y="150" width="4" height="52" rx="2" fill="#e3b873"/>
  <text class="m kind" x="298" y="170">FUNCTION</text>
  <text class="m cap"  x="298" y="188">Normalize</text>
</g>

<!-- node 3a : enrich -->
<g>
  <rect class="node n3" x="436" y="92" width="120" height="52" rx="9" fill="#101820" stroke="#63d2a5"/>
  <rect x="436" y="92" width="4" height="52" rx="2" fill="#63d2a5"/>
  <text class="m kind" x="498" y="112">AI AGENT</text>
  <text class="m cap"  x="498" y="130">Enrich</text>
</g>

<!-- node 3b : store -->
<g>
  <rect class="node n3" x="436" y="208" width="120" height="52" rx="9" fill="#101820" stroke="#63d2a5"/>
  <rect x="436" y="208" width="4" height="52" rx="2" fill="#63d2a5"/>
  <text class="m kind" x="498" y="228">DATABASE</text>
  <text class="m cap"  x="498" y="246">Persist</text>
</g>

<!-- node 4 : notify -->
<g>
  <rect class="node n4" x="636" y="150" width="120" height="52" rx="9" fill="#101820" stroke="#e3b873"/>
  <rect x="636" y="150" width="4" height="52" rx="2" fill="#e3b873"/>
  <text class="m kind" x="698" y="170">OUTPUT</text>
  <text class="m cap"  x="698" y="188">Notify</text>
</g>

<!-- the result: balance restored -->
<g class="yy">
  <g transform="translate(828,176) scale(0.26)">
    <circle r="100" fill="#f4efe4"/>
    <path d="M 0,-100 A 100,100 0 0,1 0,100 A 50,50 0 0,1 0,0 A 50,50 0 0,0 0,-100 Z" fill="#10151c"/>
    <circle cx="0" cy="-50" r="16" fill="#10151c"/>
    <circle cx="0" cy="50"  r="16" fill="#f4efe4"/>
    <circle r="100" fill="none" stroke="#e3b873" stroke-width="5" opacity=".9"/>
  </g>
</g>
<text class="m" x="828" y="222" font-size="10.5" fill="#6f8697" text-anchor="middle" letter-spacing="2">BALANCE</text>

<text class="m" x="36" y="278" font-size="12" fill="#4f6376">let the machine sweep the courtyard; save your strength for the climb</text>
</svg>
