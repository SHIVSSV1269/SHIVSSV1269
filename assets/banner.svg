<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Entering the Way - animated ink banner">
<title>Entering the Way</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#070a0e"/>
    <stop offset="55%"  stop-color="#0d1219"/>
    <stop offset="100%" stop-color="#141b23"/>
  </linearGradient>
  <radialGradient id="moon" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#f6efdd" stop-opacity="1"/>
    <stop offset="60%"  stop-color="#e3b873" stop-opacity=".35"/>
    <stop offset="100%" stop-color="#e3b873" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#26313d"/><stop offset="100%" stop-color="#131a22"/>
  </linearGradient>
  <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1a2029"/><stop offset="100%" stop-color="#0d1218"/>
  </linearGradient>
  <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0e1319"/><stop offset="100%" stop-color="#070a0e"/>
  </linearGradient>
  <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#c98f42"/>
    <stop offset="45%"  stop-color="#f6e3b4"/>
    <stop offset="55%"  stop-color="#f6e3b4"/>
    <stop offset="100%" stop-color="#c98f42"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="frame"><rect x="0" y="0" width="1000" height="320" rx="14"/></clipPath>
  <clipPath id="typeClip"><rect class="typeRect" x="60" y="196" width="0" height="30"/></clipPath>
</defs>

<style><![CDATA[
  .m { font-family: "Georgia","Iowan Old Style","Times New Roman",serif; }

  @keyframes spin      { to { transform: rotate(360deg); } }
  @keyframes spinBack  { to { transform: rotate(-360deg); } }
  @keyframes breathe   { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  @keyframes drift     { 0% { transform: translateX(0); } 100% { transform: translateX(-60px); } }
  @keyframes driftB    { 0% { transform: translateX(0); } 100% { transform: translateX(40px); } }
  @keyframes rise      { 0%   { transform: translateY(0)    scale(.5); opacity:0; }
                         15%  { opacity:.95; }
                         70%  { opacity:.55; }
                         100% { transform: translateY(-210px) scale(1.15); opacity:0; } }
  @keyframes draw      { to { stroke-dashoffset: 0; } }
  @keyframes fillIn    { to { fill-opacity: 1; } }
  @keyframes type      { 0% { width:0; } 55% { width:470px; } 100% { width:470px; } }
  @keyframes caret     { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  @keyframes sealPulse { 0%,100% { transform: scale(1); opacity:.92; } 50% { transform: scale(1.05); opacity:1; } }
  @keyframes halo      { 0%,100% { r: 118; opacity:.20; } 50% { r: 132; opacity:.06; } }

  .taiji   { animation: spin 26s linear infinite; transform-origin: 830px 158px; }
  .ring    { animation: spinBack 44s linear infinite; transform-origin: 830px 158px; }
  .halo    { animation: halo 7s ease-in-out infinite; }
  .mistA   { animation: drift 26s ease-in-out infinite alternate; }
  .mistB   { animation: driftB 34s ease-in-out infinite alternate; }
  .mote    { animation: rise 9s ease-in infinite; }
  .mote:nth-of-type(2)  { animation-duration: 11s;   animation-delay: -1.4s; }
  .mote:nth-of-type(3)  { animation-duration: 8.2s;  animation-delay: -3.1s; }
  .mote:nth-of-type(4)  { animation-duration: 12.5s; animation-delay: -5.0s; }
  .mote:nth-of-type(5)  { animation-duration: 9.6s;  animation-delay: -2.2s; }
  .mote:nth-of-type(6)  { animation-duration: 13.4s; animation-delay: -7.3s; }
  .mote:nth-of-type(7)  { animation-duration: 10.2s; animation-delay: -4.4s; }
  .mote:nth-of-type(8)  { animation-duration: 7.8s;  animation-delay: -6.1s; }

  .nameStroke { fill: none; stroke: url(#goldText); stroke-width: 1.1;
                stroke-dasharray: 1400; stroke-dashoffset: 1400;
                animation: draw 3.4s ease-out .3s forwards; }
  .nameFill   { fill: url(#goldText); fill-opacity: 0; animation: fillIn 2.2s ease-out 1.9s forwards; }
  .typeRect   { animation: type 6s steps(38, end) 1.2s infinite; }
  .caret      { animation: caret 1.05s step-end infinite; }
  .seal       { animation: sealPulse 5.5s ease-in-out infinite; transform-origin: 940px 262px; }
  .breathe    { animation: breathe 6s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .taiji,.ring,.halo,.mistA,.mistB,.mote,.typeRect,.caret,.seal,.breathe { animation: none; }
    .nameStroke { stroke-dashoffset: 0; } .nameFill { fill-opacity: 1; }
  }
]]></style>

<g clip-path="url(#frame)">
  <rect width="1000" height="320" fill="url(#sky)"/>

  <!-- distant moon glow behind the yin-yang -->
  <circle cx="830" cy="158" r="150" fill="url(#moon)" opacity=".28"/>

  <!-- drifting mist bands -->
  <g class="mistA" opacity=".30">
    <ellipse cx="240" cy="212" rx="230" ry="17" fill="#5d7387" filter="url(#soft)"/>
    <ellipse cx="700" cy="248" rx="270" ry="13" fill="#42596b" filter="url(#soft)"/>
  </g>
  <g class="mistB" opacity=".22">
    <ellipse cx="520" cy="176" rx="300" ry="12" fill="#7d94a8" filter="url(#soft)"/>
    <ellipse cx="120" cy="264" rx="200" ry="15" fill="#4d6a80" filter="url(#soft)"/>
  </g>

  <!-- mountain ridges: far, mid, near -->
  <g class="mistB" opacity=".9">
    <path fill="url(#ridgeFar)" d="M-60 250 L60 176 L118 206 L196 132 L268 198 L330 160 L404 226 L470 190 L540 244 L1060 244 L1060 320 L-60 320 Z"/>
  </g>
  <g class="mistA">
    <path fill="url(#ridgeMid)" d="M-60 272 L44 214 L110 246 L184 186 L252 240 L318 208 L392 262 L468 224 L556 274 L648 232 L730 276 L1060 260 L1060 320 L-60 320 Z"/>
  </g>
  <path fill="url(#ridgeNear)" d="M-20 320 L-20 292 L92 252 L188 288 L286 246 L372 290 L470 258 L582 296 L690 262 L806 300 L910 272 L1020 300 L1020 320 Z"/>

  <!-- a lone pine on the near ridge -->
  <g stroke="#0a0e13" fill="none" stroke-linecap="round" opacity=".95">
    <path d="M186 288 L186 254" stroke-width="3"/>
    <path d="M186 262 L170 252 M186 268 L202 258 M186 276 L172 268 M186 258 L198 248" stroke-width="2.2"/>
  </g>

  <!-- rising energy motes -->
  <g fill="#8fe3c4">
    <circle class="mote" cx="700" cy="300" r="2.2" opacity="0"/>
    <circle class="mote" cx="745" cy="308" r="1.6" opacity="0"/>
    <circle class="mote" cx="790" cy="296" r="2.6" opacity="0"/>
    <circle class="mote" cx="836" cy="312" r="1.8" opacity="0"/>
    <circle class="mote" cx="880" cy="300" r="2.3" opacity="0"/>
    <circle class="mote" cx="922" cy="310" r="1.5" opacity="0"/>
    <circle class="mote" cx="660" cy="306" r="1.9" opacity="0"/>
    <circle class="mote" cx="960" cy="298" r="2.1" opacity="0"/>
  </g>
  <g fill="#e3b873">
    <circle class="mote" cx="620" cy="312" r="1.7" opacity="0"/>
    <circle class="mote" cx="862" cy="304" r="1.4" opacity="0"/>
    <circle class="mote" cx="768" cy="316" r="2.0" opacity="0"/>
    <circle class="mote" cx="906" cy="316" r="1.6" opacity="0"/>
  </g>

  <!-- ============== YIN-YANG + TRIGRAM RING ============== -->
  <circle class="halo" cx="830" cy="158" r="118" fill="none" stroke="#e3b873" stroke-width=".8" opacity=".2"/>

  <g class="ring">
    <circle cx="830" cy="158" r="104" fill="none" stroke="#e3b873" stroke-width=".7" opacity=".35"/>
    <circle cx="830" cy="158" r="126" fill="none" stroke="#e3b873" stroke-width=".5" opacity=".18"/>
    <!-- eight trigrams; lines drawn top to bottom, unbroken = yang, split = yin -->
    <g stroke="#e3b873" stroke-width="3.4" stroke-linecap="round" opacity=".8">
      <!-- Heaven -->
      <g transform="translate(830,158) rotate(0) translate(0,-115)">
        <path d="M-11 -6 H11"/><path d="M-11 0 H11"/><path d="M-11 6 H11"/>
      </g>
      <!-- Lake -->
      <g transform="translate(830,158) rotate(45) translate(0,-115)">
        <path d="M-11 -6 H-3"/><path d="M3 -6 H11"/><path d="M-11 0 H11"/><path d="M-11 6 H11"/>
      </g>
      <!-- Fire -->
      <g transform="translate(830,158) rotate(90) translate(0,-115)">
        <path d="M-11 -6 H11"/><path d="M-11 0 H-3"/><path d="M3 0 H11"/><path d="M-11 6 H11"/>
      </g>
      <!-- Thunder -->
      <g transform="translate(830,158) rotate(135) translate(0,-115)">
        <path d="M-11 -6 H-3"/><path d="M3 -6 H11"/><path d="M-11 0 H-3"/><path d="M3 0 H11"/><path d="M-11 6 H11"/>
      </g>
      <!-- Earth -->
      <g transform="translate(830,158) rotate(180) translate(0,-115)">
        <path d="M-11 -6 H-3"/><path d="M3 -6 H11"/><path d="M-11 0 H-3"/><path d="M3 0 H11"/><path d="M-11 6 H-3"/><path d="M3 6 H11"/>
      </g>
      <!-- Mountain -->
      <g transform="translate(830,158) rotate(225) translate(0,-115)">
        <path d="M-11 -6 H11"/><path d="M-11 0 H-3"/><path d="M3 0 H11"/><path d="M-11 6 H-3"/><path d="M3 6 H11"/>
      </g>
      <!-- Water -->
      <g transform="translate(830,158) rotate(270) translate(0,-115)">
        <path d="M-11 -6 H-3"/><path d="M3 -6 H11"/><path d="M-11 0 H11"/><path d="M-11 6 H-3"/><path d="M3 6 H11"/>
      </g>
      <!-- Wind -->
      <g transform="translate(830,158) rotate(315) translate(0,-115)">
        <path d="M-11 -6 H11"/><path d="M-11 0 H11"/><path d="M-11 6 H-3"/><path d="M3 6 H11"/>
      </g>
    </g>
  </g>

  <g class="taiji" filter="url(#glow)">
    <g transform="translate(830,158) scale(0.78)">
      <circle r="100" fill="#f4efe4"/>
      <path d="M 0,-100 A 100,100 0 0,1 0,100 A 50,50 0 0,1 0,0 A 50,50 0 0,0 0,-100 Z" fill="#10151c"/>
      <circle cx="0" cy="-50" r="16" fill="#10151c"/>
      <circle cx="0" cy="50"  r="16" fill="#f4efe4"/>
      <circle r="100" fill="none" stroke="#e3b873" stroke-width="2.2" opacity=".85"/>
    </g>
  </g>

  <!-- ===================== TEXT ===================== -->
  <text class="m breathe" x="62" y="80" font-size="17" fill="#e2513f" letter-spacing="7">THE WAY FOLLOWS NATURE</text>

  <text class="m nameStroke" x="60" y="156" font-size="58" font-weight="700" letter-spacing="2">SHIVSSV1269</text>
  <text class="m nameFill"   x="60" y="156" font-size="58" font-weight="700" letter-spacing="2">SHIVSSV1269</text>

  <g clip-path="url(#typeClip)">
    <text class="m" x="60" y="216" font-size="19" fill="#9ec7b6" letter-spacing=".6">
      Cultivating code, one breakthrough at a time.
    </text>
  </g>
  <rect class="caret" x="60" y="198" width="2" height="22" fill="#63d2a5" opacity=".9">
    <animate attributeName="x" values="62;532;532;62" dur="6s" begin="1.2s" repeatCount="indefinite" keyTimes="0;0.55;0.92;1" calcMode="linear"/>
  </rect>

  <!-- seal, stamped with a small yin-yang instead of a character -->
  <g class="seal">
    <rect x="912" y="234" width="56" height="56" rx="7" fill="#a8271c" opacity=".92"/>
    <rect x="917" y="239" width="46" height="46" rx="4" fill="none" stroke="#f4efe4" stroke-width="1.6" opacity=".8"/>
    <g transform="translate(940,262) scale(0.165)">
      <circle r="100" fill="#f4efe4"/>
      <path d="M 0,-100 A 100,100 0 0,1 0,100 A 50,50 0 0,1 0,0 A 50,50 0 0,0 0,-100 Z" fill="#a8271c"/>
      <circle cx="0" cy="-50" r="16" fill="#a8271c"/>
      <circle cx="0" cy="50"  r="16" fill="#f4efe4"/>
      <circle r="100" fill="none" stroke="#f4efe4" stroke-width="7" opacity=".9"/>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="999" height="319" rx="14" fill="none" stroke="#e3b873" stroke-opacity=".28"/>
</g>
</svg>
